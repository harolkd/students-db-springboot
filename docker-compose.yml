version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_students_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: studentsdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: spring_boot_api
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: